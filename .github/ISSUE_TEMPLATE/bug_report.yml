name: Bug report
description: Report a reproducible extension or connector defect.
body:
  - type: markdown
    attributes:
      value: Do not include API tokens, customer details, meter numbers, voucher codes or raw provider responses. Report vulnerabilities privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Extension and PHP version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did this occur?
      options:
        - Local demonstration or automated simulation
        - Connected Zoho development store
        - Production store
    validations:
      required: true
